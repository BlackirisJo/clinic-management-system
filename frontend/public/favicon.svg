<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- ECG pulse line — subtle, behind stethoscope -->
  <path d="M4 24 L10 24 L13 18 L17 30 L20 22 L23 28 L26 16 L29 32 L32 22 L35 24 L44 24"
        stroke="#89CFF0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.55" />

  <!-- Stethoscope ear pieces (binaurals) -->
  <ellipse cx="33" cy="9" rx="3.5" ry="2.2" fill="#89CFF0" opacity="0.85" />
  <ellipse cx="15" cy="9" rx="3.5" ry="2.2" fill="#89CFF0" opacity="0.85" />

  <!-- Stethoscope head tubes from earpieces to Y-junction -->
  <path d="M33 11.2 C33 16, 30 20, 27 23"
        stroke="#89CFF0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M15 11.2 C15 16, 18 20, 21 23"
        stroke="#89CFF0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Stethoscope Y-junction connector -->
  <circle cx="24" cy="24" r="1.8" fill="#89CFF0" opacity="0.85" />

  <!-- Stethoscope single tube down to chestpiece -->
  <path d="M24 25.8 C24 30, 20 34, 17 37.5"
        stroke="#89CFF0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Stethoscope chestpiece outer ring -->
  <circle cx="17" cy="39" r="5" stroke="#89CFF0" stroke-width="2.4" fill="none" opacity="0.85" />

  <!-- Stethoscope chestpiece inner diaphragm -->
  <circle cx="17" cy="39" r="3" fill="#89CFF0" opacity="0.35" />
  <circle cx="17" cy="39" r="1.3" fill="#89CFF0" opacity="0.6" />
</svg>