services:
  postgres_db:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/secure_backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  node_api:
    build: .
    container_name: clinic_node_api
    restart: always
    ports:
      # مرتبط على localhost فقط — الوصول العام يتم عبر Reverse Proxy (Caddy) في الإنتاج
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=${PORT}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=/app/backups
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: clinic_caddy
    restart: always
    # يُشغَّل فقط مع --profile production — التطوير المحلي يبقى على 3000/5173 (المرحلة 11.5)
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node_api

volumes:
  pgdata:
  caddy_data:
  caddy_config: